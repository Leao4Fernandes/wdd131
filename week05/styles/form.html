<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form project</title>
    <meta name="description" content="page with a form to review projects">
    <meta name="author" content="Leã Fernandes">
    <link rel="stylesheet" href="/styles/form.css">
    <script src="/scripts/form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>

        <form method="get" action="review.html">
            <label for="product">Product Name</label>
            <select name="product" id="product" required>
                <option value="" disabled selected>Select a product..</option>
            </select>

            <label for="star-rating">Star Rating</label>
            <div class="star-rating">
                
                <input type="radio" name="stars" id="star-a" value="5">
                <label for="star-a"></label>
                <input type="radio" name="stars" id="star-b" value="4">
                <label for="star-b"></label>
                <input type="radio" name="stars" id="star-c" value="3">
                <label for="star-c"></label>
                <input type="radio" name="stars" id="star-d" value="2">
                <label for="star-d"></label>
                <input type="radio" name="stars" id="star-e" value="1">
                <label for="star-e"></label>
            </div>

            <label for="date-of-installation">Date of Installation</label>
            <input type="date" id="date-of-installation" name="date-of-installation">
            
            <label id="checkbox" name="checkbox">Which features did you find useful in the product?
                (check all that apply)
            </label>
            <label><input type="checkbox" value="1" id="durability" name="durability">Durability</label>
            <label><input type="checkbox" value="1" id="ease of use" name="ease of use">Ease of use</label>
            <label><input type="checkbox" value="1" id="performance" name="performance">Performance</label>
            <label><input type="checkbox" value="1" id="design" name="design">Design</label>

            <div class="writtenReview">
                <label for="written-review">Written review</label>
                <textarea name="written-review" id="written-review"></textarea>
            </div>

            <label for="name">Your name</label>
            <input type="name" id="fname" name="name">

            <input type="submit" value="Post review">

        </form>
    </main>

    <footer>

        <p>
            © <span id="currentyear">2026</span>
            ❖ Leão Fernandes ❖ Portugal Lisbon
        </p>

        <p id="lastModified"></p>

    </footer>

</body>
</html>
