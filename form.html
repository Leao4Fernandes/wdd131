<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form project</title>
    <meta name="description" content="product page review, to give feedback about the product, and to give a star rating, for analyses and improvements.">
    <meta name="author" content="Leão Fernandes">
    <link rel="stylesheet" href="./styles/form.css">
    <script src="./scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>

        <form method="get" action="review.html">
            <label for="product">Product Name</label>
            <select name="product" id="product" required>
                <option value="" disabled selected>Select a product..</option>
            </select>

            <label>Star Rating</label>
            <div class="star-rating">

                <input type="radio" name="stars" id="star-a" value="5" required>
                <label for="star-a"></label>
                <input type="radio" name="stars" id="star-b" value="4" required>
                <label for="star-b"></label>
                <input type="radio" name="stars" id="star-c" value="3" required>
                <label for="star-c"></label>
                <input type="radio" name="stars" id="star-d" value="2" required>
                <label for="star-d"></label>
                <input type="radio" name="stars" id="star-e" value="1" required>
                <label for="star-e"></label>
            </div>

            <label for="date-of-installation">Date of Installation</label>
            <input type="date" id="date-of-installation" name="date-of-installation">

            <label id="checkbox">Which features did you find useful in the product?
                (check all that apply)
            </label>
            <div class="checkbox-option">
                <label for="durability">Durability</label>
                <input type="checkbox" value="1" id="durability" name="durability">
            </div>

            <div class="checkbox-option">
                <label for="ease-of-use">Ease of use</label>
                <input type="checkbox" value="1" id="ease-of-use" name="ease-of-use">
            </div>

            <div class="checkbox-option">
                <label for="performance">Performance</label>
                <input type="checkbox" value="1" id="performance" name="performance">
            </div>

            <div class="checkbox-option">
                <label for="design">Design</label>
                <input type="checkbox" value="1" id="design" name="design">
            </div>

            <div class="writtenReview">
                <label for="written-review">Written review</label>
                <textarea name="written-review" id="written-review"></textarea>
            </div>

            <label for="fname">Your name</label>
            <input type="text" id="fname" name="fname">

            <input type="submit" value="Post review">

        </form>
    </main>

    <footer>

        <p>
            © <span id="currentyear">2026</span>
            ❖ Leão Fernandes ❖ Portugal Lisbon
        </p>

        <p id="lastModified"></p>

    </footer>

</body>

</html>
